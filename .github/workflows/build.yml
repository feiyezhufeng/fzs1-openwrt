name: Build firmware (with TUN)

# 放到 fork 的 .github/workflows/build.yml
# 触发：Actions 页面手动 Run workflow，或推 v* 标签
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350        # OpenWrt 全量编译 1~2 小时，留足余量
    permissions:
      contents: write         # 打标签时发 Release 需要

    steps:
      - name: 清理磁盘（GitHub runner 默认只剩 ~14G，不够）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time libelf-dev

      - name: 编译固件
        run: bash build.sh

      - name: 校验产物
        run: |
          set -e
          IMG=$(ls build/openwrt-ramips-mt76x8-mibox_668m2-squashfs-sysupgrade.bin)
          ls -l "$IMG"
          SIZE_K=$(du -k "$IMG" | cut -f1)
          echo "镜像大小：${SIZE_K} KB（分区上限 16128 KB）"
          if [ "$SIZE_K" -ge 16128 ]; then echo "::error::镜像超出分区上限"; exit 1; fi
          echo "--- 关键包是否编出 ---"
          find "$HOME/fzs1-openwrt-build/openwrt/bin" -name 'zerotier_*.ipk' -o -name 'kmod-tun_*.ipk' | sed 's|.*/||' | sort
          sha256sum "$IMG" | tee build/SHA256SUMS.txt

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: mibox_668m2-sysupgrade
          path: build/*.bin
          retention-days: 30
          if-no-files-found: error

      - name: 打标签时自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.bin
          generate_release_notes: true
